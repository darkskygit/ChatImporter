[package]
authors = ["DarkSky <darksky2048@gmail.com>"]
edition = "2018"
name    = "chat_importer"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
anyhow = "1.0.102"
assetpack-core = "0.1.0"
assetpack-transform-precomp2 = "0.1.0"
async-trait = "0.1.89"
base64 = "0.22.1"
fern = "0.7.1"
htmlescape = "0.3.1"
indicatif = "0.18.4"
indicatif-log-bridge = "0.2.3"
lazy_static = "1.5.0"
mailparse = "0.16.1"
md-5 = "0.11.0"
memory-indexer = "0.3.1"
mur3 = "0.1.0"
mp4 = "0.14.0"
muxide = "0.2.5"
num_enum = "0.7.6"
path-absolutize = "3.1.1"
path-ext = "0.1.2"
prost = "0.14.3"
roxmltree = "0.21.1"
rpassword = "7.5.3"
rust_h265 = "0.1.0"
scraper = "0.27.0"
serde_json = "1.0.150"
sha3 = "0.11.0"
sqlx = { version = "0.8.6", features = [
  "sqlite",
  "runtime-tokio-rustls",
  "chrono",
] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "fs"] }
walkdir = "2.5.0"
zstd = "0.13.3"

chrono       = { workspace = true }
hex          = { workspace = true }
ibackuptool2 = { workspace = true }
log          = { workspace = true }
plist        = { workspace = true }
regex        = { workspace = true }
rusqlite     = { workspace = true }
serde        = { workspace = true }
tempfile     = { workspace = true }
rust_h264 = "0.4.0"

  [dependencies.image]
  default-features = false
  features         = ["bmp", "jpeg", "png"]
  version          = "0.25.4"

  [dependencies.structopt]
  default-features = false
  version          = "0.3.18"

[dev-dependencies]
bytes = "1.11.0"
